    <script>
      // Suppress benign Vite WebSocket/HMR connection notices in AI Studio preview iframe
      window.addEventListener('unhandledrejection', function(e) {
        var msg = String((e && e.reason && (e.reason.message || e.reason)) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        var msg = String((e && (e.message || e.error)) || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
